spring:
  application:
    name: campusgigs

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusgigs}
    username: ${DB_USERNAME:campusgigs}
    password: ${DB_PASSWORD:campusgigs}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # O schema e responsabilidade do Flyway. O Hibernate apenas valida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

campusgigs:
  jwt:
    # HS256 exige no minimo 32 bytes de chave
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-bytes-0123456789}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:120}
    emissor: ${JWT_EMISSOR:campusgigs-api}
  viacep:
    url: ${VIACEP_URL:https://viacep.com.br}
    connect-timeout-segundos: ${VIACEP_CONNECT_TIMEOUT:3}
    read-timeout-segundos: ${VIACEP_READ_TIMEOUT:5}

logging:
  level:
    org.flywaydb: INFO
    br.com.campusgigs: DEBUG
